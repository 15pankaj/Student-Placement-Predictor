<!DOCTYPE html>
<html>
<head>
    <title>Placement Predictor</title>
    <style>
        body { font-family: sans-serif; text-align: center; padding-top: 50px; background: #f4f4f9; }
        .card { background: white; padding: 20px; border-radius: 10px; display: inline-block; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
        input { display: block; margin: 10px auto; padding: 10px; width: 200px; }
        button { padding: 10px 20px; background: #28a745; color: white; border: none; cursor: pointer; }
        .result { margin-top: 20px; font-weight: bold; color: #007bff; }
    </style>
</head>
<body>
    <div class="card">
        <h2>Student Placement Predictor</h2>
        <form method="POST">
            {% csrf_token %}
            <input type="number" step="0.1" name="cgpa" placeholder="CGPA (e.g. 8.5)" required>
            <input type="number" name="internships" placeholder="Number of Internships" required>
            <input type="number" name="projects" placeholder="Number of Projects" required>
            <button type="submit">Check Status</button>
        </form>

        {% if result %}
            <div class="result">Prediction: {{ result }}</div>
        {% endif %}
    </div>
</body>
</html>
